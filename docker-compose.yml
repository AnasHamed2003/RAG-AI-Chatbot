version: '3.8'

services:
  chatbot:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./faiss_db:/app/faiss_db
      - ./feedback.jsonl:/app/feedback.jsonl
      - ./models:/app/models  # Cache for Hugging Face models
    environment:
      - HF_HOME=/app/models
    deploy:
      resources:
        limits:
          memory: 4G  # Increased memory for model loading
        reservations:
          memory: 2G