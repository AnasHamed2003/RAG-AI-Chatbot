version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./init_ollama.sh:/init_ollama.sh
    entrypoint: ["/bin/bash", "/init_ollama.sh"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5

  chatbot:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./faiss_db:/app/faiss_db
      - ./feedback.jsonl:/app/feedback.jsonl
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434

volumes:
  ollama_data: