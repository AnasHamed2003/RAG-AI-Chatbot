openapi: 3.0.3
info:
  title: Private RAG Chatbot API
  description: API for the RAG chatbot brain
  version: 1.0.0
servers:
  - url: http://localhost:8000
    description: Local development server
paths:
  /:
    get:
      summary: Health check
      description: Check if the API is running
      responses:
        "200":
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "healthy"
  /chat:
    post:
      summary: Chat with the RAG system
      description: Send a question and get an answer based on private documents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Invalid request"
components:
  schemas:
    ChatRequest:
      type: object
      required:
        - question
      properties:
        question:
          type: string
          description: The user's question
          maxLength: 1000
          example: "What is the capital of France?"
    ChatResponse:
      type: object
      required:
        - answer
      properties:
        answer:
          type: string
          description: The generated answer
          example: "The capital of France is Paris."
